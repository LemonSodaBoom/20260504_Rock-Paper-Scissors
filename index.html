<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>與刀也猜拳對戰</title>
    <link rel="stylesheet" href="./css/Rock-Paper-Scissors.css">
</head>
<body>

    <div class="game-container">
        
        <header class="scoreboard">
            <div class="hp-box">
                <span class="player-name">野生刀也⚔️</span>
                <div id="comp-hp" class="hearts">❤️❤️</div>
            </div>
            <div class="vs-badge">VS</div>
            <div class="hp-box">
                <span class="player-name">訓練家 🧢</span>
                <div id="player-hp" class="hearts">❤️❤️</div>
            </div>
        </header>

        <main class="battle-arena">
            <div id="comp-bubble" class="bubble hidden">
                <span id="comp-choice-emoji">👊</span>
                <span id="comp-choice-text">石頭！</span>
            </div>
            <div class="character">
                <img id="comp-character" src="./img/01.png" alt="">
            </div>
        </main>

        <footer class="player-hand">
            <div class="card" onclick="playRound('rock', this)">
                <div class="card-emoji">👊</div>
                <div class="card-text">石頭</div>
            </div>
            <div class="card" onclick="playRound('paper', this)">
                <div class="card-emoji">🖐️</div>
                <div class="card-text">布</div>
            </div>
            <div class="card" onclick="playRound('scissors', this)">
                <div class="card-emoji">✌️</div>
                <div class="card-text">剪刀</div>
            </div>
        </footer>

        <div id="result-overlay" class="overlay">
            <div class="overlay-box">
                <h1 id="final-title">WIN!</h1>
                <p id="final-desc">你打敗了野生刀也！</p>
                <button onclick="resetGame()" class="btn-restart">再來一局</button>
            </div>
        </div>

    </div>

    <script src="./js/Rock-Paper-Scissors.js"></script>
</body>
</html>
